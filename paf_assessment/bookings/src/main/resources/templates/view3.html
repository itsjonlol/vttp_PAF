<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
  
    
        

    <div class = "container">
       
        <div class = "row">
            <h1>Listing details</h1>
        </div>
        
        <!-- private String accommodationId;
        private String description;
        private String image;
        private Integer price;
        private List<String> address;
        private List<String> amenities; -->
    <table class = "table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                
                <th>Id</th>
                <th>Description</th>
                <th>Price</th>
                <th>Image</th>
                
                
            </tr>
        </thead>
        <tbody>
            <tr th:if="${errorMessage}">
                <td colspan="9" class = "text-center" th:text="${errorMessage}">No records found</td>
            </tr>
            <tr>
                <td th:text="${listingdetails.accommodationId}"></td>
                <td th:text="${listingdetails.description}"></td>
                <td th:text="${listingdetails.price}"></td>
                <td>
                <img th:src="${listingdetails.image}" height="100px" width="100px">
                </td>
                
            </tr>
        
        </tbody>
        
    </table>
    <label> Address</label>
    <div>
        <ul>
            <li th:each="ad : ${listingdetails.address}" th:text="${ad}"></li>
        </ul>
    </div>
    <br>
    <label>Amenities</label>
    <ul>
        <li th:each="a : ${listingdetails.amenities}" th:text="${a}"></li>
    </ul>

    <!-- private String resv_id;
    private String name;
    private String email;
    private Date arrivalDate;
    private Integer durration;
    private String acc_id; -->
    <!-- <form method="POST" th:action="@{/book/{accommodationId}(accommodationId=${listingdetails.accommodationId})}">
        <label>Name</label>
        <input type="text" name="name"></input>
        <br>
        <label>Email</label>
        <input type="text" name="email"></input>
        <br>
        <label>Date</label>
        <input type="date" name="arrivalDate"></input>
        <br>
        <label>Duration ( no of days )</label>
        <input type="number" name="duration"></input>
        

        
        

        <button type="submit" value="submit">submit</button>
    </form> -->
    <form method="POST" th:action="@{/book/{accommodationId}(accommodationId=${listingdetails.accommodationId})}" 
      th:object="${reservations}" >
    
    <div class="form-group">
        <label for="name">Name</label>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
        <input type="text" id="name" name="name" th:field="*{name}" class="form-control" placeholder="Enter Name" required />
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
        <input type="email" id="email" name="email" th:field="*{email}" class="form-control" placeholder="Enter Email" required />
    </div>

    <div class="form-group">
        <label for="arrivalDate">Arrival Date</label>
        <div th:if="${#fields.hasErrors('arrivalDate')}" th:errors="*{arrivalDate}" class="text-danger"></div>
        <input type="date" id="arrivalDate" name="arrivalDate" th:field="*{arrivalDate}" class="form-control" required />
    </div>

    <div class="form-group">
        <label for="duration">Duration (Number of Days)</label>
        <div th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}" class="text-danger"></div>
        <input type="number" id="duration" name="duration" th:field="*{duration}" class="form-control" placeholder="Enter Duration" min="1" required />
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>

    <p th:if="${errorBooking}" th:text="${errorBooking}" class="text-danger"></p>

    <button id="go-back">Back</button>
     
    <a th:href="@{/search(country=${countrysession}, accommodates=${accommodatessession}, price=${pricesession})}">
        Go back (session)
    </a>
    
</div>
<script>
    document.getElementById("go-back").addEventListener("click", () => {
  history.back();
});
</script>


    
</body>
</html>
