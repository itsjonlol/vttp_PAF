<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
  
    
        

    <div    class = "container">
       
        <div class = "row">
            <h1>Listings</h1>
        </div>
        
      
    <table class = "table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                
                <th>Name</th>
                <th>Price</th>
                <th>Image</th>
                <th>Details</th>
                
            </tr>
        </thead>
        <tbody>
            <tr th:if="${listings.size() == 0 }">
                <td colspan="9" class = "text-center">No record found</td>
            </tr>
            

            <tr  th:each="l : ${listings}">
               

                <td th:text="${l.name}"></td>
                <td th:text="${l.price}"></td>
                <td><img th:src="${l.image}" alt="Image" width="100px" height="100px"></td>

                
                
                <td>
                    <a th:href="@{/details/{accommodationid}(accommodationid=${l.accommodationId})}" class="btn btn-success">Details</a>

                </td>
                

               
            </tr>
        </tbody>
    </table>
</div>

    
</body>
</html>
